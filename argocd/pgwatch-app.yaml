apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgwatch-core
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://cybertec-postgresql.github.io/pgwatch-charts/
      chart: pgwatch
      targetRevision: 0.5.0
      helm:
        valueFiles:
          - $values/custom-values.yaml
    - repoURL: https://github.com/WellingtoneLuvonga/pgwatch-gitops-wellingtone.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: pgwatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
