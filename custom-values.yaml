pgwatch:
  service:
    ports:
      - name: http
        port: 8080
        targetPort: 8080
      - name: metrics
        port: 9188
        targetPort: 9188

  postgres:
    enablePgSink: false
    credentials:
      username: "pgwatch"
      password: "dummyPassword123!"
    adminCredentials:
      password: "dummyAdminPassword123!"
  prometheus:
    enablePromSink: true
    newPrometheus:
      createPrometheus: false
  grafana:
    enableGrafana: false
  podAnnotations:
    reloader.stakater.com/auto: "true"

  # The chart will mount this block directly into /tmp/pgwatch-sources/sources.yaml
  sources:
    files:
      sources.yaml: |
        - name: postgres_wellingtone
          conn_str: ${POSTGRES_WELLINGTONE_CONN}
          preset_metrics: full
          is_enabled: true
          custom_tags:
            region: localhost
            role: primary
            cluster: localhost-cluster
            customer: wellingtone-local

        - name: postgres_customer_beta
          conn_str: ${POSTGRES_CUSTOMER_BETA_CONN}
          preset_metrics: full
          is_enabled: true
          custom_tags:
            region: localhost
            role: primary
            cluster: cypex-cluster
            customer: customer-beta

        - name: postgres_customer_gamma
          conn_str: ${POSTGRES_CUSTOMER_GAMMA_CONN}
          preset_metrics: full
          is_enabled: true
          custom_tags:
            region: localhost
            role: primary
            cluster: test-cluster
            customer: customer-gamma

  # Inject the secret keys as environment variables into the pod
  envFrom:
    - secretRef:
        name: pgwatch-sources-secret
