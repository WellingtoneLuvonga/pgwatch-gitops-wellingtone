
- op: replace
  path: /spec/groups/0/rules/5
  value:
    alert: DiskSpace95percentUsed
    expr: pgwatch_psutil_disk_percent{customer="customer-eta"} >= 95
    for: 5m
    annotations:
      summary: "Disk at 95% (Customer customer-eta SLA)"
      description: "Current disk space utilization is at 95% on {{ $labels.dbname }}"
      priority: P1
    labels:
      team: dba
      namespace: default
