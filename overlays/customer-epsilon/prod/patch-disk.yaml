
- op: replace
  path: /spec/groups/0/rules/5
  value:
    alert: DiskSpace40percentUsed
    expr: pgwatch_psutil_disk_percent{customer="customer-epsilon"} >= 40
    for: 5m
    annotations:
      summary: "Disk at 40% (Customer customer-delta SLA)"
      description: "Current disk space utilization is at 40% on {{ $labels.dbname }}"
      priority: P1
    labels:
      team: dba
      namespace: default
