apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgwatch-base-alerts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/WellingtoneLuvonga/pgwatch-gitops-wellingtone.git
    targetRevision: HEAD
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
