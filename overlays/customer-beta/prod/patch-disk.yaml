
- op: replace
  path: /spec/groups/0/rules/5
  value:
    alert: DiskSpace60percentUsed
    expr: pgwatch_psutil_disk_percent{customer="customer-beta"} >= 60
    for: 5m
    annotations:
      summary: "Disk at 60% (Customer customer-beta SLA)"
      description: "Current disk space utilization is at 60% on {{ $labels.dbname }}"
      priority: P1
    labels:
      team: dba
      namespace: default
