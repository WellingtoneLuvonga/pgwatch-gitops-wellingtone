apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwatch-crunchy-watcher
  namespace: pgwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgwatch-crunchy-watcher
  template:
    metadata:
      labels:
        app: pgwatch-crunchy-watcher
    spec:
      serviceAccountName: pgwatch-discovery-sa
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          env:
            - name: TIMO03T_TOKEN
              valueFrom:
                secretKeyRef:
                  name: timo03t-dev-token
                  key: token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                cat <<EOF > /tmp/sources-dynamic.yaml
              # Auto-generated by Multi-Cluster Watcher Controller (timo03t)
              EOF

                if [ -n "$TIMO03T_TOKEN" ]; then
                  # 1. Fetch ALL secrets in a single API call (~1 second)
                  kubectl --server=https://api.timo03t.sbb-aws-test.net:6443 \
                    --token="$TIMO03T_TOKEN" \
                    --insecure-skip-tls-verify \
                    get secrets -n dev -l postgres-operator.crunchydata.com/cluster -o json > /tmp/all_secrets.json 2>/dev/null

                  # 2. Extract -pguser- secrets and parse local JSON
                  jq -c '.items[] | select(.metadata.name | contains("-pguser-"))' /tmp/all_secrets.json 2>/dev/null | while read -r item; do
                    SEC=$(echo "$item" | jq -r '.metadata.name')
                    NS=$(echo "$item" | jq -r '.metadata.namespace')

                    U=$(echo "$item" | jq -r '.data.user // ""' | base64 -d 2>/dev/null)
                    P=$(echo "$item" | jq -r '.data.password // ""' | base64 -d 2>/dev/null)
                    H=$(echo "$item" | jq -r '.data.host // ""' | base64 -d 2>/dev/null)
                    PORT=$(echo "$item" | jq -r '.data.port // ""' | base64 -d 2>/dev/null)
                    DB=$(echo "$item" | jq -r '.data.dbname // ""' | base64 -d 2>/dev/null)

                    PORT=${PORT:-5432}
                    DB=${DB:-postgres}

                    if [ -n "$U" ] && [ -n "$P" ] && [ -n "$H" ]; then
                      CLUSTER=$(echo "$SEC" | sed 's/-pguser-.*//')
                      USER_TAG=$(echo "$SEC" | sed 's/.*-pguser-//')
                      cat <<EOF >> /tmp/sources-dynamic.yaml
              - name: crunchy_timo03t_${NS}_${CLUSTER}_${USER_TAG}
                conn_str: postgresql://${U}:${P}@${H}:${PORT}/${DB}
                preset_metrics: minimal
                is_enabled: true
                custom_tags:
                  environment: dev-timo03t
                  namespace: ${NS}
                  cluster: ${CLUSTER}
                  user: ${USER_TAG}
              EOF
                    fi
                  done
                fi

                # 3. Apply ConfigMap instantaneously
                kubectl create configmap pgwatch-sources-cm -n pgwatch \
                  --from-file=sources-dynamic.yaml=/tmp/sources-dynamic.yaml \
                  --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null

                sleep 20
              done
