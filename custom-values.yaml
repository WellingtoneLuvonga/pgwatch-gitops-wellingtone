pgwatch:
  postgres:
    enablePgSink: false
    credentials:
      username: "pgwatch"
      password: "dummyPassword123!"
    adminCredentials:
      password: "dummyAdminPassword123!"
  prometheus:
    enablePromSink: true
    newPrometheus:
      createPrometheus: false
  grafana:
    enableGrafana: false
  sources:
    files: {}
  extraVolumes:
    - name: pgwatch-sources-volume
      secret:
        secretName: pgwatch-sources-secret
  extraVolumeMounts:
    - name: pgwatch-sources-volume
      mountPath: /tmp/pgwatch-sources/sources.yaml
      subPath: sources.yaml
      readOnly: true

extraVolumes:
  - name: pgwatch-sources-volume
    secret:
      secretName: pgwatch-sources-secret

extraVolumeMounts:
  - name: pgwatch-sources-volume
    mountPath: /tmp/pgwatch-sources/sources.yaml
    subPath: sources.yaml
    readOnly: true
