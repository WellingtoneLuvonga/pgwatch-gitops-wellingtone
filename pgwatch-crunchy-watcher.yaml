apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwatch-crunchy-watcher
  namespace: pgwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgwatch-crunchy-watcher
  template:
    metadata:
      labels:
        app: pgwatch-crunchy-watcher
    spec:
      serviceAccountName: pgwatch-discovery-sa
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          env:
            - name: TIMO03T_TOKEN
              valueFrom:
                secretKeyRef:
                  name: timo03t-dev-token
                  key: token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                cat <<EOF > /tmp/sources-dynamic.yaml
              # Auto-generated by Multi-Cluster Watcher Controller (timo03t)
              EOF

                if [ -n "$TIMO03T_TOKEN" ]; then
                  API_URL="https://api.timo03t.sbb-aws-test.net:6443"

                  # Bulk fetch secrets (POSIX safe)
                  kubectl --server="$API_URL" --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify \
                    get secrets -n dev -l postgres-operator.crunchydata.com/cluster \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.data.user}{"|"}{.data.password}{"|"}{.data.host}{"|"}{.data.port}{"|"}{.data.dbname}{"\n"}{end}' 2>/dev/null > /tmp/raw_secrets.txt

                  grep '\-pguser\-' /tmp/raw_secrets.txt | while IFS='|' read -r SEC U_B64 P_B64 H_B64 PORT_B64 DB_B64; do
                    NS="dev"
                    U=$(echo "$U_B64" | base64 -d 2>/dev/null)
                    P=$(echo "$P_B64" | base64 -d 2>/dev/null)
                    H=$(echo "$H_B64" | base64 -d 2>/dev/null)
                    PORT=$(echo "$PORT_B64" | base64 -d 2>/dev/null)
                    DB=$(echo "$DB_B64" | base64 -d 2>/dev/null)

                    PORT=${PORT:-5432}
                    DB=${DB:-postgres}

                    # Escape single quotes for key-value string safety
                    P_ESCAPED=$(echo "$P" | sed "s/'/\\\\'/g")

                    if [ -n "$U" ] && [ -n "$P" ] && [ -n "$H" ]; then
                      CLUSTER=$(echo "$SEC" | sed 's/-pguser-.*//')
                      USER_TAG=$(echo "$SEC" | sed 's/.*-pguser-//')
                      cat <<EOF >> /tmp/sources-dynamic.yaml
              - name: crunchy_timo03t_${NS}_${CLUSTER}_${USER_TAG}
                conn_str: "host=${H} port=${PORT} user=${U} password='${P_ESCAPED}' dbname=${DB} sslmode=disable"
                preset_metrics: minimal
                is_enabled: true
                custom_tags:
                  environment: dev-timo03t
                  namespace: ${NS}
                  cluster: ${CLUSTER}
                  user: ${USER_TAG}
              EOF
                    fi
                  done
                fi

                kubectl create configmap pgwatch-sources-cm -n pgwatch \
                  --from-file=sources-dynamic.yaml=/tmp/sources-dynamic.yaml \
                  --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null

                sleep 20
              done
