
- op: replace
  path: /spec/groups/0/rules/5
  value:
    alert: DiskSpace50percentUsed
    expr: pgwatch_psutil_disk_percent{customer="customer-delta"} >= 50
    for: 5m
    annotations:
      summary: "Disk at 50% (Customer customer-delta SLA)"
      description: "Current disk space utilization is at 50% on {{ $labels.dbname }}"
      priority: P1
    labels:
      team: dba
      namespace: default
