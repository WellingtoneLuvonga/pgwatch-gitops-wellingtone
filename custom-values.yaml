pgwatch:
  postgres:
    enablePgSink: false
    # Dummy credentials so the chart generates pgwatch-postgresql-secret-pgwatch
    credentials:
      username: "pgwatch"
      password: "dummyPassword123!"
    adminCredentials:
      password: "dummyAdminPassword123!"
  prometheus:
    enablePromSink: true

    newPrometheus:
      createPrometheus: false

  grafana:
    enableGrafana: false

  sources:
    files: {} # Leave empty to avoid creating plain ConfigMaps

  # Mount the unsealed SealedSecret into the pgwatch container
  extraVolumes:
    - name: pgwatch-sources-volume
      secret:
        secretName: pgwatch-sources-secret

  extraVolumeMounts:
    - name: pgwatch-sources-volume
      mountPath: /etc/pgwatch3/sources.yaml
      subPath: sources.yaml
      readOnly: true
