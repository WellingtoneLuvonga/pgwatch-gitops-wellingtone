apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: patroni-global-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  # Automatically monitors all current and future namespaces
  namespaceSelector:
    any: true
  # Matches any pod generated by Crunchy Data / Patroni
  selector:
    matchExpressions:
      - key: postgres-operator.crunchydata.com/patroni
        operator: Exists
  podMetricsEndpoints:
    - targetPort: 5432  # Bind to the container port declared in Kubernetes
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      relabelings:
        # Rewrite the scrape target from IP:5432 to IP:8008 before execution
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: '${1}:8008'
      metricRelabelings:
        # Map Patroni node name to 'dbname' for Grafana variable filtering
        - sourceLabels: [name]
          targetLabel: dbname
        - sourceLabels: [pod]
          targetLabel: dbname
