apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwatch-crunchy-watcher
  namespace: pgwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgwatch-crunchy-watcher
  template:
    metadata:
      labels:
        app: pgwatch-crunchy-watcher
    spec:
      hostAliases:
        - ip: "10.241.44.228"
          hostnames:
            - "api.timo03t.sbb-aws-test.net"
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          env:
            - name: TIMO03T_TOKEN
              valueFrom:
                secretKeyRef:
                  name: timo03t-dev-token
                  key: token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              API_URL="https://api.timo03t.sbb-aws-test.net:6443"
              while true; do
                if [ -n "$TIMO03T_TOKEN" ]; then
                  echo "--- Discovering 76 Crunchy DBs in OpenShift dev ---"
                  
                  kubectl --server="$API_URL" --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify \
                    get secrets -n dev -l postgres-operator.crunchydata.com/cluster \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.data.user}{"|"}{.data.password}{"|"}{.data.host}{"|"}{.data.port}{"|"}{.data.dbname}{"\n"}{end}' 2>/dev/null > /tmp/raw_secrets.txt

                  cat <<EOC > /tmp/sources.yaml
              # Auto-discovered Crunchy PGO Databases
              EOC

                  grep '\-pguser\-' /tmp/raw_secrets.txt | while IFS='|' read -r SEC U_B64 P_B64 H_B64 PORT_B64 DB_B64; do
                    U=$(echo "$U_B64" | base64 -d 2>/dev/null)
                    P=$(echo "$P_B64" | base64 -d 2>/dev/null)
                    H=$(echo "$H_B64" | base64 -d 2>/dev/null)
                    PORT=$(echo "$PORT_B64" | base64 -d 2>/dev/null)
                    DB=$(echo "$DB_B64" | base64 -d 2>/dev/null)
                    CLUSTER=$(echo "$SEC" | sed 's/-pguser-.*//')
                    USER_TAG=$(echo "$SEC" | sed 's/.*-pguser-//')

                    if [ -n "$U" ] && [ -n "$P" ] && [ -n "$H" ]; then
                      cat <<EOC >> /tmp/sources.yaml
              - name: crunchy_${CLUSTER}_${USER_TAG}
                conn_str: "host=${H} port=${PORT:-5432} user=${U} password='${P}' dbname=${DB:-postgres} sslmode=disable"
                preset_metrics: minimal
                is_enabled: true
              EOC
                    fi
                  done

                  # Sync ConfigMap into remote OpenShift dev namespace
                  kubectl --server="$API_URL" --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify \
                    create configmap pgwatch-sources-cm -n dev \
                    --from-file=sources.yaml=/tmp/sources.yaml \
                    --dry-run=client -o yaml | \
                    kubectl --server="$API_URL" --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify \
                    apply -n dev -f - 2>/dev/null
                fi
                sleep 30
              done
