apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwatch-crunchy-watcher
  namespace: pgwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgwatch-crunchy-watcher
  template:
    metadata:
      labels:
        app: pgwatch-crunchy-watcher
    spec:
      serviceAccountName: pgwatch-discovery-sa
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          env:
            - name: TIMO03T_TOKEN
              valueFrom:
                secretKeyRef:
                  name: timo03t-dev-token
                  key: token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                cat <<EOF > /tmp/sources-dynamic.yaml
              # Auto-generated by Multi-Cluster Watcher Controller (timo03t)
              EOF

                if [ -n "$TIMO03T_TOKEN" ]; then
                  API_URL="https://api.timo03t.sbb-aws-test.net:6443"
                  EXT_HOST="api.timo03t.sbb-aws-test.net"

                  # 1. Fetch all secrets in 1 bulk call
                  kubectl --server="$API_URL" --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify \
                    get secrets -n dev -l postgres-operator.crunchydata.com/cluster \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.data.user}{"\t"}{.data.password}{"\t"}{.data.host}{"\t"}{.data.port}{"\t"}{.data.dbname}{"\n"}{end}' 2>/dev/null > /tmp/raw_secrets.txt

                  # 2. Fetch all NodePorts in 1 bulk call
                  kubectl --server="$API_URL" --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify \
                    get svc -n dev -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.ports[0].nodePort}{"\n"}{end}' 2>/dev/null > /tmp/raw_services.txt

                  grep '\-pguser\-' /tmp/raw_secrets.txt | while IFS=$'\t' read -r SEC U_B64 P_B64 H_B64 PORT_B64 DB_B64; do
                    NS="dev"
                    U=$(echo "$U_B64" | base64 -d 2>/dev/null)
                    P=$(echo "$P_B64" | base64 -d 2>/dev/null)
                    DB=$(echo "$DB_B64" | base64 -d 2>/dev/null)
                    DB=${DB:-postgres}

                    CLUSTER=$(echo "$SEC" | sed 's/-pguser-.*//')
                    USER_TAG=$(echo "$SEC" | sed 's/.*-pguser-//')

                    # Match NodePort assigned to this cluster's -np service
                    NODE_PORT=$(grep "^${CLUSTER}-np"$'\t' /tmp/raw_services.txt | cut -f2)

                    if [ -n "$NODE_PORT" ]; then
                      TARGET_HOST="$EXT_HOST"
                      TARGET_PORT="$NODE_PORT"
                    else
                      TARGET_HOST=$(echo "$H_B64" | base64 -d 2>/dev/null)
                      TARGET_PORT=$(echo "$PORT_B64" | base64 -d 2>/dev/null)
                      TARGET_PORT=${TARGET_PORT:-5432}
                    fi

                    if [ -n "$U" ] && [ -n "$P" ] && [ -n "$TARGET_HOST" ]; then
                      cat <<EOF >> /tmp/sources-dynamic.yaml
              - name: crunchy_timo03t_${NS}_${CLUSTER}_${USER_TAG}
                conn_str: postgresql://${U}:${P}@${TARGET_HOST}:${TARGET_PORT}/${DB}
                preset_metrics: minimal
                is_enabled: true
                custom_tags:
                  environment: dev-timo03t
                  namespace: ${NS}
                  cluster: ${CLUSTER}
                  user: ${USER_TAG}
              EOF
                    fi
                  done
                fi

                kubectl create configmap pgwatch-sources-cm -n pgwatch \
                  --from-file=sources-dynamic.yaml=/tmp/sources-dynamic.yaml \
                  --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null

                sleep 20
              done
