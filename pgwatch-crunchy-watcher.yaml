apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwatch-crunchy-watcher
  namespace: pgwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgwatch-crunchy-watcher
  template:
    metadata:
      labels:
        app: pgwatch-crunchy-watcher
    spec:
      serviceAccountName: pgwatch-discovery-sa
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          env:
            - name: TIMO03T_TOKEN
              valueFrom:
                secretKeyRef:
                  name: timo03t-dev-token
                  key: token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                cat <<EOF > /tmp/sources-dynamic.yaml
              # Auto-generated by Multi-Cluster Watcher Controller (timo03t)
              EOF

                # OpenShift timo03t Remote Discovery
                if [ -n "$TIMO03T_TOKEN" ]; then
                  REMOTE_SECRETS=$(kubectl --server=https://api.timo03t.sbb-aws-test.net:6443 --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify get secrets -n dev -l postgres-operator.crunchydata.com/cluster --no-headers -o jsonpath='{range .items[*]}{.metadata.namespace}{":"}{.metadata.name}{"\n"}{end}' 2>/dev/null)
                  for item in $REMOTE_SECRETS; do
                    NS=$(echo $item | cut -d: -f1)
                    SEC=$(echo $item | cut -d: -f2)
                    URI=$(kubectl --server=https://api.timo03t.sbb-aws-test.net:6443 --token="$TIMO03T_TOKEN" --insecure-skip-tls-verify get secret $SEC -n $NS -o jsonpath='{.data.uri}' 2>/dev/null | base64 -d 2>/dev/null)
                    if [ -n "$URI" ]; then
                      CLUSTER=$(echo $SEC | sed 's/-pguser-.*//')
                      cat <<EOF >> /tmp/sources-dynamic.yaml
              - name: crunchy_timo03t_${NS}_${CLUSTER}
                conn_str: ${URI}
                preset_metrics: minimal
                is_enabled: true
                custom_tags:
                  environment: dev-timo03t
                  namespace: ${NS}
                  cluster: ${CLUSTER}
              EOF
                    fi
                  done
                fi

                kubectl patch configmap pgwatch-sources-cm -n pgwatch -p "{\"data\":{\"sources-dynamic.yaml\":$(jq -Rs . /tmp/sources-dynamic.yaml)}}" 2>/dev/null
                sleep 20
              done
