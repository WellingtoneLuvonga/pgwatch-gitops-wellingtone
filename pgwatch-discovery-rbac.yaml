apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgwatch-discovery-sa
  namespace: pgwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgwatch-discovery-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgwatch-discovery-binding
subjects:
  - kind: ServiceAccount
    name: pgwatch-discovery-sa
    namespace: pgwatch
roleRef:
  kind: ClusterRole
  name: pgwatch-discovery-role
  apiGroup: rbac.authorization.k8s.io
