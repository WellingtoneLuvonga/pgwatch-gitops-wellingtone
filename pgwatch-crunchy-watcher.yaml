apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwatch-crunchy-watcher
  namespace: pgwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgwatch-crunchy-watcher
  template:
    metadata:
      labels:
        app: pgwatch-crunchy-watcher
    spec:
      serviceAccountName: pgwatch-discovery-sa
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                SECRETS=$(kubectl get secrets -A -l postgres-operator.crunchydata.com/cluster --no-headers -o jsonpath='{range .items[*]}{.metadata.namespace}{":"}{.metadata.name}{"\n"}{end}' 2>/dev/null)
                
                cat <<EOF > /tmp/sources-dynamic.yaml
              # Auto-generated by Crunchy Watcher Controller
              EOF

                for item in $SECRETS; do
                  NS=$(echo $item | cut -d: -f1)
                  SEC=$(echo $item | cut -d: -f2)
                  
                  URI=$(kubectl get secret $SEC -n $NS -o jsonpath='{.data.uri}' 2>/dev/null | base64 -d 2>/dev/null)
                  
                  if [ -n "$URI" ]; then
                    CLUSTER=$(echo $SEC | sed 's/-pguser-.*//')
                    cat <<EOF >> /tmp/sources-dynamic.yaml
              - name: crunchy_${NS}_${CLUSTER}
                conn_str: ${URI}
                preset_metrics: minimal
                is_enabled: true
                custom_tags:
                  environment: dynamic-crunchy
                  namespace: ${NS}
                  cluster: ${CLUSTER}
              EOF
                  fi
                done
                
                kubectl patch configmap pgwatch-sources-cm -n pgwatch -p "{\"data\":{\"sources-dynamic.yaml\":$(jq -Rs . /tmp/sources-dynamic.yaml)}}" 2>/dev/null
                sleep 20
              done
